<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Noticia</title>
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo.png" />
    <link rel="stylesheet" href="../../css/design-system.css" />
    <link rel="stylesheet" href="../../css/admin-common.css" />
    <link rel="stylesheet" href="../../css/form-news.css" />
</head>

<body>
    <!-- Unified Navbar -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="../index.html">NoticiaPTY</a>
        <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
          <span></span><span></span><span></span>
        </button>
        <div class="navbar-menu" id="navbarMenu">
          <div class="navbar-actions" style="margin-left:0;width:100%;justify-content:flex-end;">
            <div class="navbar-user" id="navbarUser">
              <span class="navbar-user-name" id="usernameDisplay"></span>
              <button class="navbar-user-btn" id="publicarBtn" style="display:none;">
                <i class="fas fa-newspaper"></i> Publicar
              </button>
              <button class="navbar-user-btn" id="supervisorPanelBtn" style="display:none;">
                <i class="fas fa-chart-line"></i> Panel
              </button>
              <button class="navbar-user-btn" id="adminBtn" style="display:none;">
                <i class="fas fa-users-cog"></i> Admin
              </button>
              <button class="navbar-user-btn" id="btn-editar" style="display:none;">
                <i class="fa-solid fa-user"></i> Perfil
              </button>
              <button class="navbar-user-btn navbar-user-btn-danger" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
              </button>
            </div>
            <div class="navbar-auth" id="navbarAuth">
              <a href="../auth/iniciar-sesion/index.html" class="navbar-auth-btn">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
              </a>
              <a href="../auth/registro/index.html" class="navbar-auth-btn navbar-auth-btn-register">
                <i class="fas fa-user-plus"></i> Registrarse
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Botón de regreso -->
    <div style="margin-bottom: 20px">
        <button
            class="volver-btn"
            onclick="window.location.href='../administrar-noticia/index.html'"
            style="background-color: #6c757d"
        >
            ← Volver al Panel de Noticias
        </button>
    </div>

    <!-- FORMULARIO PRINCIPAL -->
    <form id="formNoticia" enctype="multipart/form-data">
        <!-- Campos ocultos -->
        <input type="hidden" id="noticia_id" name="id" />
        <input type="hidden" id="usuario_id" name="usuario" />

        <!-- Título -->
        <label for="titulo">Título:</label>
        <input type="text" name="titulo" id="titulo" required />

        <!-- Contenido -->
        <label for="contenido">Contenido:</label>
        <textarea name="contenido" id="contenido" rows="10" required></textarea>

        <!-- Categoría -->
        <label for="categoria">Categoría:</label>
        <select name="categoria_id" id="categoria" required>
            <option value="">Selecciona una categoría</option>
            <option value="1">Deportes</option>
            <option value="2">Política</option>
            <option value="3">Tecnología</option>
            <option value="4">Entretenimiento</option>
        </select>

        <!-- CONTENEDOR DE IMÁGENES (dinámico desde JS) -->
        <label>Imágenes actuales:</label>
        <!-- Aquí se insertan dinámicamente las imágenes desde el JS -->
        <!-- No poner nada aquí, el script lo rellenará -->
        <div id="imagenes-actuales"></div>

        <!-- Subir nuevas imágenes opcionalmente -->
        <label for="imagen">Agregar nuevas imágenes (opcional):</label>
        <input
            type="file"
            id="imagen"
            name="imagenes"
            accept="image/*"
            multiple
        />

        <!-- Autor -->
        <label for="autor">Autor (nombre apellido):</label>
        <input
            type="text"
            name="autor"
            id="autor"
            required
            pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ]+(?:\s[A-Za-zÁÉÍÓÚáéíóúÑñ]+)+$"
            title="Debe ingresar nombre y apellido separados por un espacio."
        />

        <!-- Botón guardar -->
        <button type="submit">Guardar Cambios</button>
    </form>

    <!-- JS -->
    <script type="module" src="editar-noticia.js"></script>
</body>
</html>
