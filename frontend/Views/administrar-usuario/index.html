<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoticiaPTY - Administrar Usuarios</title>
  <link rel="stylesheet" href="../../css/design-system.css" />
  <link rel="stylesheet" href="../../css/admin-common.css" />
  <link rel="stylesheet" href="../../css/admin-users.css" />
  <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="../assets/logo.png" />
</head>
<body>
  <!-- Unified Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="../index.html">NoticiaPTY</a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
        <span></span><span></span><span></span>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <div class="navbar-actions" style="margin-left:0;width:100%;justify-content:flex-end;">
          <div class="navbar-user" id="navbarUser">
            <span class="navbar-user-name" id="usernameDisplay"></span>
            <button class="navbar-user-btn" id="publicarBtn" style="display:none;">
              <i class="fas fa-newspaper"></i> Publicar
            </button>
            <button class="navbar-user-btn" id="supervisorPanelBtn" style="display:none;">
              <i class="fas fa-chart-line"></i> Panel
            </button>
            <button class="navbar-user-btn" id="adminBtn" style="display:none;">
              <i class="fas fa-users-cog"></i> Admin
            </button>
            <button class="navbar-user-btn" id="btn-editar" style="display:none;">
              <i class="fa-solid fa-user"></i> Perfil
            </button>
            <button class="navbar-user-btn navbar-user-btn-danger" id="logoutBtn">
              <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
          </div>
          <div class="navbar-auth" id="navbarAuth">
            <a href="../auth/iniciar-sesion/index.html" class="navbar-auth-btn">
              <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </a>
            <a href="../auth/registro/index.html" class="navbar-auth-btn navbar-auth-btn-register">
              <i class="fas fa-user-plus"></i> Registrarse
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Botón de regreso -->
  <div style="margin-bottom: 20px;">
    <button class="volver-btn" onclick="window.location.href='../index.html'">
      ← Volver al Inicio
    </button>
  </div>
  <div class="container">
    <!-- Formulario para agregar usuario -->
  <form id="formAddUser">
    <h2>Agregar Nuevo Usuario</h2>
    <label>Nombre:
      <input type="text" id="nombre" required />
    </label>
    <label>Apellido:
      <input type="text" id="apellido" required />
    </label>
    <label>Usuario:
      <input type="text" id="usuario" required />
    </label>
    <label>Contraseña:
      <input type="password" id="contrasena" required />
    </label>
    <label>Rol:
      <select id="rol" required>
        <option value="">Seleccione</option>
        <option value="editor">Editor</option>
        <option value="global">Global</option>
        <option value="admin">Admin</option>
        <option value="supervisor">Supervisor</option>
      </select>
    </label>
    <button id =btnRegistrar type="submit">Agregar Usuario</button>
  </form>
  <input
    type="text"
    id="buscadorUsuarios"
    placeholder="Buscar usuario por nombre, apellido o nombre de usuario..."
    style="margin: 1rem 0; padding: 0.5rem; width: 100%; max-width: 400px;"
  />
  <div id="filtrosUsuarios" style="margin-bottom: 1rem;">
    <button data-filtro="todos">Todos</button>
    <button data-filtro="activos">Activos</button>
    <button data-filtro="inactivos">Inactivos</button>
    <button data-filtro="supervisor">supervisores</button>
    <button data-filtro="editor">Editores</button>
    <button data-filtro="admin">Admin</button>
  </div>

  <!-- Tabla con usuarios -->
  <h2>Lista de Usuarios</h2>
  <table id="usersTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Usuario</th>
        <th>Rol</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <!-- Aquí se llenarán los usuarios -->
    </tbody>
  </table>
  <div id="paginacionUsuarios" class="paginacion-container"></div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="panel_usuarios.js"></script>
</body>
</html>
