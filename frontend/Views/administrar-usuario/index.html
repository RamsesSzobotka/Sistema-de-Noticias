<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoticiaPTY - Administrar Usuarios</title>
  <link rel="stylesheet" href="../../css/design-system.css" />
  <link rel="stylesheet" href="../../css/admin-common.css" />
  <link rel="stylesheet" href="../../css/admin-users.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link
        rel="icon"
        type="image/png"
        sizes="16x16"
        href="../assets/logo.png" />
</head>
<body>
  <!-- Unified Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <!-- LEFT: brand + visits + greeting -->
      <div class="navbar-left">
        <a class="navbar-brand" href="/">NoticiaPTY</a>
        <span class="visitor-count">
          <i class="fas fa-users"></i>
          <span id="visitorCount">0 visitas</span>
        </span>
        <span class="navbar-greeting" id="navbarGreeting" style="display:none;">
          <i class="fa-solid fa-user"></i>
          Hola, <span id="usernameDisplay"></span>
        </span>
      </div>

      <!-- HAMBURGER (mobile only) -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
        <span></span><span></span><span></span>
      </button>

      <!-- COLLAPSIBLE MENU (center + right) -->
      <div class="navbar-menu" id="navbarMenu">
        <div class="navbar-center">
          <div class="navbar-search">
            <input type="text" id="searchInput" placeholder="Buscar noticias..." />
            <button id="searchBtn"><i class="fas fa-search"></i></button>
          </div>
          <select class="navbar-categories-dropdown" id="categorySelect" aria-label="Filtrar por categoría">
            <option value="todas">Todas</option>
            <option value="deporte">Deportes</option>
            <option value="politica">Política</option>
            <option value="tecnologia">Tecnología</option>
            <option value="entretenimiento">Entretenimiento</option>
          </select>
        </div>

        <div class="navbar-right">
            <div class="navbar-user" id="navbarUser">
            </div>
            <div class="navbar-auth" id="navbarAuth">
            </div>
        </div>
      </div>
    </div>

      <!-- Drawer Overlay -->
      <div class="drawer-overlay" id="drawerOverlay"></div>

      <!-- Side Drawer -->
      <div class="side-drawer" id="sideDrawer">
        <!-- User info (logged in) -->
        <div class="drawer-user-info" id="drawerUserInfo" style="display:none;">
          <i class="fa-solid fa-user"></i>
          <span id="drawerUsername"></span>
        </div>

        <!-- Action buttons (logged in users) -->
        <div class="drawer-user" id="drawerUser">
          <button class="drawer-btn" id="publicarBtn" style="display:none;">
            <i class="fas fa-newspaper"></i> Publicar
          </button>
          <button class="drawer-btn" id="supervisorPanelBtn" style="display:none;">
            <i class="fas fa-chart-line"></i> Panel
          </button>
          <button class="drawer-btn" id="adminBtn" style="display:none;">
            <i class="fas fa-users-cog"></i> Admin
          </button>
          <button class="drawer-btn" id="btn-editar" style="display:none;">
            <i class="fa-solid fa-user"></i> Perfil
          </button>
        </div>

        <!-- Auth buttons (guest users) -->
        <div class="drawer-auth" id="drawerAuth">
          <a href="/auth/iniciar-sesion/" class="drawer-btn">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
          </a>
          <a href="/auth/registro/" class="drawer-btn drawer-btn-register">
            <i class="fas fa-user-plus"></i> Registrarse
          </a>
        </div>

        <div class="drawer-spacer"></div>
        <div class="drawer-divider"></div>

        <!-- Logout at bottom -->
        <button class="drawer-btn drawer-btn-danger" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
      </div>
    </nav>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <div class="container">
  <!-- Header -->
  <div class="admin-header">
    <div>
      <h2><i class="fas fa-users-cog"></i> Administrar Usuarios</h2>
      <p>Gestiona los usuarios del sistema: crea, edita, activa o desactiva cuentas.</p>
    </div>
  </div>

  <!-- Accordion: Formulario para agregar usuario -->
  <div class="accordion" id="accordionAddUser">
    <div class="accordion-header" id="accordionToggle">
      <div class="accordion-header-left">
        <i class="fas fa-user-plus"></i>
        <span>Nuevo Usuario</span>
      </div>
      <i class="fas fa-chevron-down accordion-icon" id="accordionIcon"></i>
    </div>
    <div class="accordion-body" id="accordionBody">
      <div class="accordion-content">
        <form id="formAddUser" class="user-form">
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Nombre del usuario" required />
          </div>
          <div class="form-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" placeholder="Apellido del usuario" required />
          </div>
          <div class="form-group">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Nombre de usuario" required />
          </div>
          <div class="form-group">
            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Contraseña segura" required />
          </div>
          <div class="form-group full-width">
            <label for="rol">Rol</label>
            <select id="rol" required>
              <option value="">Seleccione un rol</option>
              <option value="editor">Editor</option>
              <option value="global">Global</option>
              <option value="admin">Admin</option>
              <option value="supervisor">Supervisor</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> Crear Usuario
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Search & Filters -->
  <div class="search-filters-bar">
    <div class="search-wrapper">
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        id="buscadorUsuarios"
        placeholder="Buscar por nombre, apellido o usuario..."
      />
    </div>
    <div class="filter-pills" id="filtrosUsuarios">
      <button class="filter-pill active" data-filtro="todos">Todos</button>
      <button class="filter-pill" data-filtro="activos">Activos</button>
      <button class="filter-pill" data-filtro="inactivos">Inactivos</button>
      <button class="filter-pill" data-filtro="supervisor">Supervisores</button>
      <button class="filter-pill" data-filtro="editor">Editores</button>
      <button class="filter-pill" data-filtro="admin">Admin</button>
    </div>
  </div>

  <!-- Users Table -->
  <div class="table-container">
    <table id="usersTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Usuario</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Poblado por JS -->
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div id="paginacionUsuarios" class="paginacion-container"></div>
</div>

<!-- Modal de edición -->
<div class="modal-overlay" id="editModalOverlay">
  <div class="modal" id="editModal">
    <div class="modal-header">
      <h3><i class="fas fa-user-edit"></i> Editar Usuario</h3>
      <button class="modal-close" id="editModalClose">&times;</button>
    </div>
    <div class="modal-body">
      <form id="editUserForm" class="modal-form">
        <input type="hidden" id="editUserId" />
        <div class="form-group">
          <label for="editNombre">Nombre</label>
          <input type="text" id="editNombre" required />
        </div>
        <div class="form-group">
          <label for="editApellido">Apellido</label>
          <input type="text" id="editApellido" required />
        </div>
        <div class="form-group">
          <label for="editUsuario">Usuario</label>
          <input type="text" id="editUsuario" required />
        </div>
        <div class="form-group">
          <label for="editRol">Rol</label>
          <select id="editRol" required>
            <option value="editor">Editor</option>
            <option value="global">Global</option>
            <option value="admin">Admin</option>
            <option value="supervisor">Supervisor</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="editModalCancel">Cancelar</button>
      <button class="btn btn-primary" id="editModalSave">
        <i class="fas fa-save"></i> Guardar Cambios
      </button>
    </div>
  </div>
</div>
  <script type="module" src="panel_usuarios.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var hp="/";
  var cs=document.getElementById("categorySelect");
  if(cs) cs.addEventListener("change",function(e){localStorage.setItem("selectedCategory",e.target.value);window.location.href=hp;});
  function ds(){var q=document.getElementById("searchInput");if(q&&q.value.trim()){localStorage.setItem("searchQuery",q.value.trim());window.location.href=hp;}}
  var sb=document.getElementById("searchBtn");if(sb)sb.addEventListener("click",ds);
  var si=document.getElementById("searchInput");if(si)si.addEventListener("keyup",function(e){if(e.key==="Enter")ds();});
  // Drawer toggle handled by setupDrawer() in panel_usuarios.js
});
</script>
</body>
</html>
