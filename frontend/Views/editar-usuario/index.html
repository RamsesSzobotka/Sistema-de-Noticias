<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoticiaPTY - Editar Usuario</title>
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="../assets/logo.png"/>
  <link rel="stylesheet" href="../../css/design-system.css" />
  <link rel="stylesheet" href="../../css/admin-common.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    html,
    body {
      height: 100vh;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    /* Estilo para el contenedor */
    .container {
      max-width: 400px;
      width: 90%;
      padding: var(--space-xl);
      background-color: var(--color-bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
    }

    /* Título de sección */
    .container h2 {
      font-size: var(--font-size-xxl);
      margin-bottom: var(--space-lg);
      color: var(--color-text-dark);
      text-align: center;
    }

    /* Formulario */
    .form-usuario {
      display: flex;
      flex-direction: column;
      gap: var(--space-lg);
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-sm);
      color: var(--color-text-dark);
      font-size: var(--font-size-base);
    }

    .form-group input {
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-base);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      transition: all 0.25s ease-in-out;
    }

    .form-group input:focus {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
      outline: none;
    }

    .form-group input[disabled] {
      background-color: var(--color-bg-dark);
      color: var(--color-text-muted);
      cursor: not-allowed;
    }

    /* Botones */
    .botones {
      display: flex;
      justify-content: flex-end;
      gap: var(--space-md);
      margin-top: var(--space-lg);
    }

    .btn {
      font-family: inherit;
      font-size: var(--font-size-base);
      padding: var(--space-sm) var(--space-md);
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    /* Botón Editar */
    .btn-editar {
      background-color: var(--color-primary);
      color: var(--color-white);
      box-shadow: var(--shadow-md);
    }

    .btn-editar:hover {
      background-color: var(--color-primary-dark);
      transform: scale(1.03);
    }

    .btn-editar:active {
      background-color: var(--color-primary-darker);
      transform: scale(0.97);
    }

    /* Botón Guardar */
    .btn-guardar {
      background-color: var(--color-success);
      color: var(--color-white);
      box-shadow: var(--shadow-md);
      display: none;
    }

    .btn-guardar:hover {
      background-color: var(--color-success-dark);
      transform: scale(1.03);
    }

    .btn-guardar:active {
      background-color: var(--color-success-dark);
      transform: scale(0.97);
    }
  </style>
</head>

<body>

  <!-- Unified Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <!-- LEFT: brand + visits + greeting -->
      <div class="navbar-left">
        <a class="navbar-brand" href="/">NoticiaPTY</a>
        <span class="visitor-count">
          <i class="fas fa-users"></i>
          <span id="visitorCount">0 visitas</span>
        </span>
        <span class="navbar-greeting" id="navbarGreeting" style="display:none;">
          <i class="fa-solid fa-user"></i>
          Hola, <span id="usernameDisplay"></span>
        </span>
      </div>

      <!-- HAMBURGER (mobile only) -->
      <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
        <span></span><span></span><span></span>
      </button>

      <!-- COLLAPSIBLE MENU (center + right) -->
      <div class="navbar-menu" id="navbarMenu">
        <div class="navbar-center">
          <div class="navbar-search">
            <input type="text" id="searchInput" placeholder="Buscar noticias..." />
            <button id="searchBtn"><i class="fas fa-search"></i></button>
          </div>
          <select class="navbar-categories-dropdown" id="categorySelect" aria-label="Filtrar por categoría">
            <option value="todas">Todas</option>
            <option value="deporte">Deportes</option>
            <option value="politica">Política</option>
            <option value="tecnologia">Tecnología</option>
            <option value="entretenimiento">Entretenimiento</option>
          </select>
        </div>

        <div class="navbar-right">
            <div class="navbar-user" id="navbarUser">
            </div>
            <div class="navbar-auth" id="navbarAuth">
            </div>
        </div>
      </div>
    </div>

      <!-- Drawer Overlay -->
      <div class="drawer-overlay" id="drawerOverlay"></div>

      <!-- Side Drawer -->
      <div class="side-drawer" id="sideDrawer">
        <!-- User info (logged in) -->
        <div class="drawer-user-info" id="drawerUserInfo" style="display:none;">
          <i class="fa-solid fa-user"></i>
          <span id="drawerUsername"></span>
        </div>

        <!-- Action buttons (logged in users) -->
        <div class="drawer-user" id="drawerUser">
          <button class="drawer-btn" id="publicarBtn" style="display:none;">
            <i class="fas fa-newspaper"></i> Publicar
          </button>
          <button class="drawer-btn" id="supervisorPanelBtn" style="display:none;">
            <i class="fas fa-chart-line"></i> Panel
          </button>
          <button class="drawer-btn" id="adminBtn" style="display:none;">
            <i class="fas fa-users-cog"></i> Admin
          </button>
          <button class="drawer-btn" id="btn-editar" style="display:none;">
            <i class="fa-solid fa-user"></i> Perfil
          </button>
        </div>

        <!-- Auth buttons (guest users) -->
        <div class="drawer-auth" id="drawerAuth">
          <a href="/auth/iniciar-sesion/" class="drawer-btn">
            <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
          </a>
          <a href="/auth/registro/" class="drawer-btn drawer-btn-register">
            <i class="fas fa-user-plus"></i> Registrarse
          </a>
        </div>

        <div class="drawer-spacer"></div>
        <div class="drawer-divider"></div>

        <!-- Logout at bottom -->
        <button class="drawer-btn drawer-btn-danger" id="logoutBtn">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
        </button>
      </div>
    </nav>

  <!-- Botón de regreso -->
  <div style="margin-bottom: var(--space-lg)">
    <button
      class="volver-btn"
      onclick="window.location.href='/'"
      style="background-color: var(--color-text-muted)">
      ← Volver al Panel de Noticias
    </button>
  </div>
  <div class="container">
    <h2>Editar mis datos</h2>
    <form id="formEditarSesion" class="form-usuario">
      <div class="form-group">
        <label>Nombre</label>
        <input type="text" name="nombre" disabled>
      </div>
      <div class="form-group">
        <label>Apellido</label>
        <input type="text" name="apellido" disabled>
      </div>
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="usuario" disabled>
      </div>
      <div class="botones">
        <button type="button" id="btnEditar" class="btn btn-editar">Editar</button>
        <button type="submit" id="btnGuardar" class="btn btn-guardar" style="display: none;">Guardar cambios</button>
      </div>
    </form>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script type="module" src="editar_usuario.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
  var hp="/";
  var cs=document.getElementById("categorySelect");
  if(cs) cs.addEventListener("change",function(e){localStorage.setItem("selectedCategory",e.target.value);window.location.href=hp;});
  function ds(){var q=document.getElementById("searchInput");if(q&&q.value.trim()){localStorage.setItem("searchQuery",q.value.trim());window.location.href=hp;}}
  var sb=document.getElementById("searchBtn");if(sb)sb.addEventListener("click",ds);
  var si=document.getElementById("searchInput");if(si)si.addEventListener("keyup",function(e){if(e.key==="Enter")ds();});
  // Drawer toggle handled by setupDrawer() in editar_usuario.js
});
</script>
</body>

</html>
