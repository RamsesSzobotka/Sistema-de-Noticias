<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../../css/design-system.css" />
    <link rel="stylesheet" href="../../css/detail.css" />
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo.png"  />
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>NoticiaPTY - Detalle de Noticia</title>
</head>

<body>
    <!-- Unified Navbar -->
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="navbar-brand" href="../index.html">NoticiaPTY</a>
        
        <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
          <span></span><span></span><span></span>
        </button>
        
        <div class="navbar-menu" id="navbarMenu">
          <div class="navbar-actions">
            <select class="navbar-categories-dropdown" id="categorySelect" aria-label="Filtrar por categoría">
              <option value="todas">Todas</option>
              <option value="deporte">Deportes</option>
              <option value="politica">Política</option>
              <option value="tecnologia">Tecnología</option>
              <option value="entretenimiento">Entretenimiento</option>
            </select>
            <div class="navbar-search">
              <input type="text" id="searchInput" placeholder="Buscar noticias..." />
              <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="navbar-user" id="navbarUser">
              <span class="navbar-user-name" id="usernameDisplay"></span>
              <button class="navbar-user-btn" id="publicarBtn" style="display:none;">
                <i class="fas fa-newspaper"></i> Publicar
              </button>
              <button class="navbar-user-btn" id="supervisorPanelBtn" style="display:none;">
                <i class="fas fa-chart-line"></i> Panel
              </button>
              <button class="navbar-user-btn" id="adminBtn" style="display:none;">
                <i class="fas fa-users-cog"></i> Admin
              </button>
              <button class="navbar-user-btn" id="btn-editar" style="display:none;">
                <i class="fa-solid fa-user"></i> Perfil
              </button>
              <button class="navbar-user-btn navbar-user-btn-danger" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
              </button>
            </div>
            
            <div class="navbar-auth" id="navbarAuth">
              <a href="../auth/iniciar-sesion/index.html" class="navbar-auth-btn">
                <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
              </a>
              <a href="../auth/registro/index.html" class="navbar-auth-btn navbar-auth-btn-register">
                <i class="fas fa-user-plus"></i> Registrarse
              </a>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <article class="article-page">
      <div class="article-hero">
        <img id="imagen1" class="article-hero-image" alt="Imagen principal" />
        <span class="category-badge" id="categoriaBadge"></span>
      </div>
      
      <div class="article-body">
        <h1 class="article-title" id="titulo"></h1>
        
        <div class="article-meta-bar">
          <span><i class="far fa-user"></i> <span id="autor"></span></span>
          <span><i class="far fa-calendar-alt"></i> <span id="fecha_creacion"></span></span>
          <span><i class="far fa-clock"></i> <span id="readingTime"></span></span>
        </div>
        
        <div class="article-content" id="contenido"></div>
        
        <div class="article-images" id="imagenesAdicionales">
          <img id="imagen2" class="article-image-full" alt="Imagen 2" style="display:none" />
          <img id="imagen3" class="article-image-full" alt="Imagen 3" style="display:none" />
        </div>
      </div>
      
      <div class="article-footer">
        <button id="likeBtn" class="like-btn">
          <i class="fas fa-thumbs-up"></i> <span id="likeCount">0</span> Me gusta
        </button>
        <div class="comment-count-bar">
          <i class="far fa-comment"></i> <span id="commentCount">0</span> comentarios
        </div>
      </div>
      
      <div class="comments-section">
        <h2>Comentarios</h2>
        <div id="commentsContainer" class="comments-list"></div>
        
        <form id="commentForm" class="comment-form">
          <textarea id="commentText" placeholder="Escribe tu comentario..." required></textarea>
          <button class="comment-submit-btn" type="submit">
            <i class="fas fa-paper-plane"></i> Enviar comentario
          </button>
        </form>
      </div>
    </article>

    <script type="module" src="script.js"></script>
</body>

</html>
