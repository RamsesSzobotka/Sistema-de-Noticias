<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="../../css/design-system.css" />
        <link rel="stylesheet" href="../../css/auth.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        />
        <link rel="icon" type="image/png" sizes="16x16" href="../assets/logo.png"  />
        <title>NoticiaPTY - Iniciar Sesión</title>
    </head>
    <body>
        <!-- Unified Navbar -->
        <nav class="navbar">
          <div class="navbar-inner">
            <a class="navbar-brand" href="../../index.html">NoticiaPTY</a>
            <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
              <span></span><span></span><span></span>
            </button>
            <div class="navbar-menu" id="navbarMenu">
              <div class="navbar-actions" style="margin-left:0;width:100%;justify-content:flex-end;">
                <div class="navbar-auth" id="navbarAuth">
                  <a href="../../auth/iniciar-sesion/index.html" class="navbar-auth-btn">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                  </a>
                  <a href="../../auth/registro/index.html" class="navbar-auth-btn navbar-auth-btn-register">
                    <i class="fas fa-user-plus"></i> Registrarse
                  </a>
                </div>
              </div>
            </div>
          </div>
        </nav>
        <div class="auth-container">
            <form id="loginForm" class="auth-form">
                <h2><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h2>

                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required />
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                    />
                </div>

                <button type="submit" class="auth-submit">
                    Iniciar Sesión
                </button>

                <div class="auth-links">
                    <p>
                        ¿No tienes una cuenta?
                        <a href="../registro/index.html">Regístrate aquí</a>
                    </p>
                </div>
            </form>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script type="module" src="script.js"></script>
    </body>
</html>
