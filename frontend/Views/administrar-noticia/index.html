<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoticiaPTY - Administrar Noticias</title>
  <link rel="stylesheet" href="../../css/design-system.css" />
  <link rel="stylesheet" href="../../css/admin-common.css" />
  <link rel="stylesheet" href="../../css/admin-approval.css" />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="../../assets/logo.png" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link>
</head>

<body>
  <!-- Unified Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="../index.html">NoticiaPTY</a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Menú de navegación">
        <span></span><span></span><span></span>
      </button>
      <div class="navbar-menu" id="navbarMenu">
        <div class="navbar-actions" style="margin-left:0;width:100%;justify-content:flex-end;">
          <div class="navbar-user" id="navbarUser">
            <span class="navbar-user-name" id="usernameDisplay"></span>
            <button class="navbar-user-btn" id="publicarBtn" style="display:none;">
              <i class="fas fa-newspaper"></i> Publicar
            </button>
            <button class="navbar-user-btn" id="supervisorPanelBtn" style="display:none;">
              <i class="fas fa-chart-line"></i> Panel
            </button>
            <button class="navbar-user-btn" id="adminBtn" style="display:none;">
              <i class="fas fa-users-cog"></i> Admin
            </button>
            <button class="navbar-user-btn" id="btn-editar" style="display:none;">
              <i class="fa-solid fa-user"></i> Perfil
            </button>
            <button class="navbar-user-btn navbar-user-btn-danger" id="logoutBtn">
              <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
          </div>
          <div class="navbar-auth" id="navbarAuth">
            <a href="../auth/iniciar-sesion/index.html" class="navbar-auth-btn">
              <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
            </a>
            <a href="../auth/registro/index.html" class="navbar-auth-btn navbar-auth-btn-register">
              <i class="fas fa-user-plus"></i> Registrarse
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Botón de regreso -->
  <div style="margin-bottom: 20px;">
    <button class="volver-btn" onclick="window.location.href='../index.html'">
      ← Volver al Inicio
    </button>
  </div>

  <div class="container">
    <input
      type="text"
      id="buscadorNoticias"
      placeholder="Buscar noticias..."
      style="margin-bottom: 20px; padding: 8px; width: 300px;" />
    <div class="filtros-noticias">
      <button id="btnMostrarTodas" class="btn-filtro">
        <i class="fas fa-list"></i>Todas
      </button>
      <button id="btnFiltrarActivas" class="btn-filtro">
        <i class="fas fa-check-circle"></i>Activas
      </button>
      <button id="btnFiltrarInactivas" class="btn-filtro">
        <i class="fas fa-times-circle"></i>Inactivas
      </button>
    </div>


    <!-- Tabla con noticias -->
    <h2>Lista de Noticias</h2>
    <table id="noticiasTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Contenido</th>
          <th>Categoría</th>
          <th>Autor</th>
          <th>Imagen</th>
          <th>Fecha de Creación</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <!-- Se cargan filas aquí -->
      </tbody>
    </table>

    <div id="paginacion" class="paginacion-container"></div>

    <!-- Modal para imagen -->
    <div id="modalImagen" class="modal-imagen" style="display: none;">
      <span id="cerrarModal" class="cerrar-modal">&times;</span>
      <img class="contenido-modal" id="imagenGrande" src="" alt="Imagen ampliada">
    </div>
<!-- 🧾 Modal para contenido de noticia -->
<div id="modalContenido" class="modal-contenido" style="display: none;">
  <div class="contenido-modal-texto">
    <span id="cerrarModalContenido" class="cerrar-modal">&times;</span>
    <h3>Contenido completo</h3>
    <p id="textoCompleto" style="white-space: pre-line;"></p>
  </div>
</div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="panel_noticias.js"></script>
</body>

</html>
